name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails fast if npm did not install the native binding for this OS/arch
      # or if it cannot load and run a query (e.g. missing duckdb.dll on Windows)
      - name: Verify DuckDB native binding
        run: npm run verify:native

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      # Run unit tests (autocomplete, SQL parsing, and DuckDBService against
      # the real native binding: queries, local files, ATTACH, temp dir)
      - name: Run unit tests
        run: npm run test:unit

      - name: Run VS Code tests
        run: npm test

  # Package platform-specific extensions
  # Each target must run on a runner that matches its architecture
  # so npm installs the correct native bindings
  package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (M1/M2) - macos-14+ are ARM64
          - os: macos-14
            target: darwin-arm64
          # macOS x64 (Intel) - macos-15-intel for x64 builds
          - os: macos-15-intel
            target: darwin-x64
          # Windows x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package extension for ${{ matrix.target }}
        run: npx @vscode/vsce package --target ${{ matrix.target }} --out duckdb-${{ matrix.target }}.vsix

      # vsce does not check that the bundled binding matches --target. Check
      # the VSIX ships only this target's binding, then load it from the
      # extracted package and run a query.
      - name: Verify packaged native binding
        run: node scripts/verify-native-binding.mjs --target ${{ matrix.target }} --vsix duckdb-${{ matrix.target }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'

  # Publish to VS Code Marketplace (only on version tags)
  publish-vscode:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

